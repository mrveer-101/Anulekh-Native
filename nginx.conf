server {
    listen 8080;
    server_name localhost;

    # Gzip compression (reduces 3.4MB bundle to ~600KB for lightning fast loading)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Google Cloud Run recommended keepalive configuration
    # GFE keepalive timeout is up to 600s; Nginx must be higher to avoid connection drops
    keepalive_timeout 650s;
    keepalive_requests 10000;
    client_header_timeout 120s;
    client_body_timeout 120s;
    send_timeout 120s;

    # Root web files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache with gzip support
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint for Cloud Run
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    error_page 404 /index.html;
}
